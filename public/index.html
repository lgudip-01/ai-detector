<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Text Detector</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; padding: 10px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 10px 18px; font-weight: bold; cursor: pointer; }
    #result { margin-top: 16px; padding: 12px; display: none; font-weight: bold; border-radius: 4px; }
    .ai { background: #ffebe9; color: #cf222e; }
    .human { background: #dafbe1; color: #1a7f37; }
  </style>
</head>
<body>
  <h2>AI Text Detector</h2>
  <textarea id="text" placeholder="Paste text here..."></textarea><br />
  <button id="btn" onclick="checkText()">Analyze</button>
  <div id="result"></div>

  <script>
    async function checkText() {
      const text = document.getElementById("text").value;
      const resDiv = document.getElementById("result");
      const btn = document.getElementById("btn");
      if (!text.trim()) return;

      btn.disabled = true;
      btn.innerText = "Analyzing...";
      resDiv.style.display = "none";

      try {
        const res = await fetch("/api/index", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text })
        });
        const data = await res.json();
        resDiv.style.display = "block";
        resDiv.innerText = "Result: " + data.label;
        resDiv.className = data.prediction === 1 ? "ai" : "human";
      } catch (err) {
        alert("Request failed.");
      } finally {
        btn.disabled = false;
        btn.innerText = "Analyze";
      }
    }
  </script>
</body>
</html>
