<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticity Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #191816;
      --surface: #22211e;
      --surface-border: #35332e;
      --text: #e8e5de;
      --text-muted: #9e9a8f;
      --accent: #aac248;
      --accent-hover: #8dac43;
      --font-serif: "Newsreader", Georgia, serif;
      --font-mono: "JetBrains Mono", Menlo, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-serif);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.6;
    }

    .container {
      width: 100%;
      max-width: 660px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.35);
    }

    .tag {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
      display: inline-block;
    }

    h1 {
      font-size: 32px;
      font-weight: 400;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 28px;
    }

    .editor-wrapper {
      position: relative;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 190px;
      background: #1c1b18;
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--font-serif);
      font-size: 17px;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .char-count {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
    }

    button {
      background-color: var(--accent);
      color: #191816;
      border: none;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 500;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    button:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #result {
      display: none;
      margin-top: 24px;
      padding: 16px 20px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      border: 1px solid;
    }

    .res-ai {
      background: rgba(217, 92, 92, 0.08);
      color: #ea8a8a;
      border-color: rgba(217, 92, 92, 0.25);
    }

    .res-human {
      background: rgba(134, 184, 140, 0.08);
      color: #a0d8a5;
      border-color: rgba(134, 184, 140, 0.25);
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="tag">Authenticity Analysis Engine // 1.0.0</span>
    <h1>Authenticity Detector</h1>
    <p class="subtitle">Inspect text for linguistic themes of artificial generation.</p>

    <div class="editor-wrapper">
      <textarea id="text" placeholder="Paste passage for evaluation..." oninput="updateCount()"></textarea>
    </div>

    <div class="footer-actions">
      <span class="char-count" id="count">0 words</span>
      <button id="btn" onclick="checkText()">Run Analysis</button>
    </div>

    <div id="result"></div>
  </main>

  <script>
    function updateCount() {
      const text = document.getElementById("text").value.trim();
      const count = text ? text.split(/\s+/).length : 0;
      document.getElementById("count").innerText = `${count} word${count === 1 ? '' : 's'}`;
    }

    async function checkText() {
      const text = document.getElementById("text").value;
      const resDiv = document.getElementById("result");
      const btn = document.getElementById("btn");

      if (!text.trim()) return;

      btn.disabled = true;
      btn.innerText = "Analyzing...";
      resDiv.style.display = "none";

      try {
        const res = await fetch("/api", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: text })
        });

        const data = await res.json();

        if (!res.ok) {
          resDiv.style.display = "block";
          resDiv.innerText = "Diagnostics: " + (data.detail || JSON.stringify(data));
          resDiv.className = "res-ai";
          return;
        }

        resDiv.style.display = "block";
        resDiv.innerText = `Classification: ${data.label}`;
        resDiv.className = data.prediction === 1 ? "res-ai" : "res-human";
      } catch (err) {
        resDiv.style.display = "block";
        resDiv.innerText = "Connection error: " + err.message;
        resDiv.className = "res-ai";
      } finally {
        btn.disabled = false;
        btn.innerText = "Run Analysis";
      }
    }
  </script>
</body>
</html>
